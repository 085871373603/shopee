<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog Produk</title>
<meta name="description" content="Katalog produk. Pembelian lewat Shopee.">
<meta name="theme-color" content="#ee4d2d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/index.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <img id="logo" class="avatar" alt="" hidden>
    <h1 id="storeName">Katalog</h1>
    <p id="tagline"></p>
    <div class="links" id="links"></div>
  </div>
</header>
<main class="wrap">
  <div class="tools">
    <input id="q" type="search" placeholder="Cari produk" aria-label="Cari produk">
    <div id="chips" class="chips" role="tablist"></div>
  </div>
  <div class="meta">
    <p id="count" class="count" aria-live="polite"></p>
    <select id="sort" class="sort" aria-label="Urutkan produk">
      <option value="">Pilihan</option><option value="baru">Terbaru</option><option value="populer">Terpopuler</option>
      <option value="murah">Harga terendah</option><option value="mahal">Harga tertinggi</option>
    </select>
  </div>
  <section id="grid" class="grid" aria-live="polite">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </section>
  <p id="empty" class="empty" hidden>Produk tidak ditemukan. Coba kata kunci atau kategori lain.</p>
</main>
<footer class="foot">Klik "Beli di Shopee" untuk checkout. Pembayaran &amp; pengiriman diproses Shopee.</footer>
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="x" id="mClose" aria-label="Tutup">×</button>
    <div id="mBody"></div>
  </div>
</div>
<div id="wa" class="wa" hidden>
  <div id="waPanel" class="wa-panel" hidden>
    <div class="wa-h">Hubungi kami<small>untuk informasi Seller, agen, dan distributor</small></div>
    <div id="waList"></div>
  </div>
  <button id="waBtn" class="wa-btn" aria-label="Chat WhatsApp">
    <svg viewBox="0 0 32 32" width="30" height="30" fill="#fff" aria-hidden="true"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.3.6 4.4 1.7 6.3L3 29l7.4-1.9c1.8 1 3.7 1.500 5.600 1.500 7 0 12.600-5.600 12.600-12.500S23 3 16 3zm0 22.800c-1.800 0-3.500-.5-5-1.400l-.4-.2-4.400 1.100 1.200-4.300-.3-.4a10 10 0 0 1-1.600-5.400C5.500 9.900 10.200 5.300 16 5.300s10.500 4.600 10.500 10.300S21.800 25.800 16 25.800zm5.800-7.600c-.3-.2-1.900-.9-2.200-1-.3-.1-.5-.2-.7.200-.2.300-.8 1-1 1.200-.2.200-.4.200-.7.100-.3-.2-1.400-.5-2.600-1.600-1-.9-1.600-1.900-1.800-2.200-.2-.3 0-.5.100-.7l.5-.5c.1-.2.200-.3.300-.5.100-.2.100-.4 0-.5l-1-2.300c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1.100 1.100-1.100 2.700s1.200 3.100 1.300 3.300c.2.200 2.300 3.500 5.600 4.900 3.300 1.400 3.300.9 3.900.9.600-.1 1.900-.8 2.200-1.500.3-.8.3-1.400.2-1.500-.1-.2-.3-.3-.6-.4z"/></svg>
  </button>
</div>
<script src="js/index.js"></script>
</body>
</html>
